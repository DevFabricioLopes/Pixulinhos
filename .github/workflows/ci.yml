name: Pixulinhos CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: ''

      - name: Install dependencies
        run: npm install

      - name: Repair PromiseLike compatibility in cmsStore
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/cmsStore.ts')
          text = path.read_text(encoding='utf-8')
          broken = "}), e => console.error(message, e));"
          fixed = "}, e => console.error(message, e));"
          original = ".catch(e => console.error(message, e));"
          fixed_original = ", e => console.error(message, e));"
          if broken in text:
              text = text.replace(broken, fixed, 1)
          elif original in text:
              text = text.replace(original, fixed_original, 1)
          else:
              raise SystemExit('Expected PromiseLike pattern not found')
          path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- src/services/cmsStore.ts; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/cmsStore.ts
          git commit -m 'fix(cms): handle Supabase PromiseLike errors correctly'
          git push origin HEAD:fix/cms-supabase-first

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
